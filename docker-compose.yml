services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: caleb-portfolio-dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/_site
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
